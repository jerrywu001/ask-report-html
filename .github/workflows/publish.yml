name: Publish askreport
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: npm-publish-askreport
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'jerrywu001/ask-report-html'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate release identity and version
        run: npm run check:release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Require a commit on the default branch
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  checks:
    needs: validate
    uses: ./.github/workflows/test.yml
  publish:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
      - name: Publish with npm trusted publishing
        run: npm publish --ignore-scripts --access public
        env:
          NPM_CONFIG_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
